<!DOCTYPE html>
<html>
    <head>
        <title>NIMBUS 3.0 Workshop</title>

        <style>
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: white;
                padding: 0px 10px;
                border-bottom: 1px solid #d1d5db;}

            body {
                background-color: #eff3ff;
                margin: 0;}

            .hero {
                text-align: center;
                padding: 100px 20px 40px;}

            .hero h1 {
                font-size: 4em;
                font-family: Arial;
                margin: 0;}

            .nimbus {
                color: black;}

            .version {
                color: #2563eb;
                text-decoration-line: underline;
                text-decoration-color: red;}

            .hero p {
                font-size: 1.5em;}

            .speakers {
                text-align: center;
                padding: 20px;}

            .speaker-container {
                display: flex;
                justify-content: center;
                gap: 30px;
                flex-wrap: wrap;}

            .speaker-card {
                background-color: white;
                width: 250px;
                padding: 30px;
                border-radius: 15px;}

            footer { 
                text-align: center;
                padding: 2rem; background: #2563eb;
                border-top: 1px solid #d1d5db;
                color: white;
                font-size: 1.5em;
                font-weight: 700;
                }
        </style>
    </head>

    <body>

        <header>
                <h2 style="margin: 6px;"><button style="background-color: white; color: black; font-size: 1.0em; padding: 15px 30px; border: none; border-radius: 10px; font-weight: 700;">NIMBUS 3.0</button></h2>
                <nav>
                <button style="background-color: white; color: black; font-size: 1.0em; padding: 8px 20px; border: none; border-radius: 10px; cursor: pointer;">Tracks</button>
                <button style="background-color: white; color: black; font-size: 1.0em; padding: 8px 15px; border: none; border-radius: 10px; cursor: pointer;">Speakers</button>
                <button style="background-color: #2563eb; color: white; font-size: 1.0em; padding: 8px 30px; border: none; border-radius: 10px; cursor: pointer;">Sign Up</button>
                </nav>
        </header>

        <section class="hero">
            <h1>
                <span class="nimbus">NIMBUS</span>
                <span class="version">3.0</span>
            </h1>

            <p>Build. Learn. Innovate.</p>
            <button style="background-color: #2563eb; color: white; font-size: 1.2em; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer;">Register Now</button>
        </section>

        <section class="speakers">
            <h2>Our Speakers</h2>
        
            <div class="speaker-container">
                <div class="speaker-card">
                    <h3>Rahul Sharma</h3>
                    <p>AI & Machine Learning</p>
                </div>
        
                <div class="speaker-card">
                    <h3>Priya Verma</h3>
                    <p>Web Development</p>
                </div>
        
                <div class="speaker-card">
                    <h3>Arjun Mehta</h3>
                    <p>Cloud Computing</p>
                </div>
            </div>
        </section>

        <footer>
            <p>NIMBUS Tech Workshop</p>
        </footer>
    </body>
</html>
